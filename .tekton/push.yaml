# Pipelines-as-Code trigger: builds and pushes the multi-arch image on every
# push to main or dev and on every pushed tag. See README "Automated builds".
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: cert-manager-webhook-porkbun-push
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && (
        target_branch in ["main", "dev", "refs/heads/main", "refs/heads/dev"] ||
        target_branch.startsWith("refs/tags/")
      )
    # git-clone is fetched from the Tekton catalog by Pipelines-as-Code.
    pipelinesascode.tekton.dev/task: "git-clone"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    name: cert-manager-webhook-porkbun-build # .tekton/build-pipeline.yaml
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: git_ref
      value: "{{ target_branch }}"
  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      nodeSelector:
        kubernetes.io/arch: amd64
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: quay-auth
      secret:
        secretName: quay-push
