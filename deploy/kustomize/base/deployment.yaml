apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook-porkbun
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager-webhook-porkbun
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cert-manager-webhook-porkbun
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: cert-manager-webhook-porkbun
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # runAsUser intentionally unset: OpenShift's restricted-v2 SCC assigns
        # a UID from the namespace range; the image defaults to 1001 elsewhere.
      containers:
        - name: webhook
          image: cert-manager-webhook-porkbun # set by kustomization.yaml `images`
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            # Unprivileged port; the Service still exposes 443.
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: GROUP_NAME # replaced by kustomization.yaml `replacements`
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: certs
          secret:
            secretName: cert-manager-webhook-porkbun-webhook-tls
        - name: tmp
          emptyDir: {}
